
{% extends 'base/base.html' %}
{% block content %}

<div class="login-page">
    <div class="login-card">
        <h2 class="login-title">Login</h2>
        <p class="login-description">Sign in to your account.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="login-field">
                <label for="login-username">Username</label>
                <input
                    id="login-username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="login-field">
                <label for="login-password">Password</label>
                <div class="password-wrapper">
                    <input
                        id="login-password"
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" id="passwordToggle" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <label class="remember-label">
                <input type="checkbox" name="remember_me" value="1">
                <span>Remember me</span>
            </label>

            <button type="submit" class="login-submit">Sign In</button>
        </form>

        <p class="login-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Sign up</a>
        </p>
    </div>
</div>

<style>
.login-page {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 65vh;
    padding: 32px 16px;
}

.login-card {
    width: 100%;
    max-width: 400px;
    padding: 32px;
    background: var(--color-white, #fff);
    border: 1px solid var(--color-border, #dedede);
    border-radius: 0;
}

/* Individual entrance animations */
.login-title,
.login-description,
.login-field,
.remember-label,
.login-submit,
.login-footer {
    animation: loginItemEnter 0.45s ease-out both;
}

.login-title {
    margin: 0 0 6px;
    color: var(--color-black, #000);
    font-size: 28px;
    font-weight: 700;
    animation-delay: 0.05s;
}

.login-description {
    margin: 0 0 28px;
    color: var(--color-gray, #6c757d);
    font-size: 13px;
    animation-delay: 0.12s;
}

.login-field {
    margin-bottom: 20px;
}

.login-field:nth-of-type(1) {
    animation-delay: 0.19s;
}

.login-field:nth-of-type(2) {
    animation-delay: 0.26s;
}

.login-field label {
    display: block;
    margin-bottom: 8px;
    color: var(--color-black, #000);
    font-size: 12px;
    font-weight: 600;
}

.login-field input {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 11px 12px;
    border: 1px solid var(--color-border, #dedede);
    border-radius: 0;
    outline: none;
    background: #fff;
    color: #000;
    font-size: 14px;
    transition: border-color 0.2s ease,
                background-color 0.2s ease;
}

.login-field input:hover {
    border-color: #999;
}

.login-field input:focus {
    border-color: #000;
    box-shadow: none;
}

/* Password input */
.password-wrapper {
    display: flex;
    align-items: center;
    border: 1px solid var(--color-border, #dedede);
    transition: border-color 0.2s ease,
                background-color 0.2s ease;
}

.password-wrapper:hover {
    border-color: #999;
}

.password-wrapper:focus-within {
    border-color: #000;
}

.password-wrapper input {
    border: none;
}

.password-wrapper input:hover,
.password-wrapper input:focus {
    border: none;
}

.password-wrapper button {
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: stretch;
    width: 44px;
    flex-shrink: 0;
    border: none;
    background: #fff;
    color: #666;
    cursor: pointer;
    transition: color 0.2s ease,
                background-color 0.2s ease;
}

.password-wrapper button:hover {
    color: #000;
    background-color: rgba(0, 0, 0, 0.045);
}

.password-wrapper button:active {
    background-color: rgba(0, 0, 0, 0.08);
}

.password-wrapper button:focus-visible {
    outline: 2px solid #000;
    outline-offset: -4px;
}

/* Remember me */
.remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 2px 0 22px;
    color: #444;
    font-size: 12px;
    cursor: pointer;
    animation-delay: 0.33s;
    transition: color 0.2s ease;
}

.remember-label:hover {
    color: #000;
}

.remember-label input {
    accent-color: #000;
    cursor: pointer;
}

/* Sign in button */
.login-submit {
    width: 100%;
    min-height: 46px;
    padding: 12px;
    border: 1px solid #000;
    border-radius: 0;
    background: #000;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    cursor: pointer;
    animation-delay: 0.40s;
    transition: background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
}

.login-submit:hover {
    background-color: #fff;
    color: #000;
    border-color: #000;
}

.login-submit:active {
    transform: scale(0.985);
}

.login-submit:focus-visible {
    outline: 2px solid #000;
    outline-offset: 3px;
}

/* Sign up link */
.login-footer {
    margin: 24px 0 0;
    color: var(--color-gray, #6c757d);
    font-size: 12px;
    text-align: center;
    animation-delay: 0.47s;
}

.login-footer a {
    color: #000;
    font-weight: 600;
    text-decoration: none;
    text-underline-offset: 3px;
    transition: color 0.2s ease,
                text-decoration-color 0.2s ease;
}

.login-footer a:hover {
    color: #666;
    text-decoration: underline;
}

.login-footer a:focus-visible {
    outline: 2px solid #000;
    outline-offset: 3px;
}

/* Smooth upward entrance */
@keyframes loginItemEnter {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media (max-width: 575.98px) {
    .login-page {
        min-height: auto;
        padding: 28px 8px;
    }

    .login-card {
        padding: 26px 20px;
    }

    .login-title {
        font-size: 25px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .login-title,
    .login-description,
    .login-field,
    .remember-label,
    .login-submit,
    .login-footer {
        animation: none !important;
        opacity: 1;
        transform: none;
    }

    .login-field input,
    .password-wrapper,
    .password-wrapper button,
    .remember-label,
    .login-submit,
    .login-footer a {
        transition: none !important;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('login-password');
    const passwordToggle = document.getElementById('passwordToggle');

    if (!passwordInput || !passwordToggle) return;

    passwordToggle.addEventListener('click', function () {
        const showPassword = passwordInput.type === 'password';

        passwordInput.type = showPassword ? 'text' : 'password';
        passwordToggle.setAttribute(
            'aria-label',
            showPassword ? 'Hide password' : 'Show password'
        );

        const icon = passwordToggle.querySelector('i');

        if (icon) {
            icon.classList.toggle('bi-eye', !showPassword);
            icon.classList.toggle('bi-eye-slash', showPassword);
        }
    });
});
</script>

{% endblock %}
